# Copia este archivo como ansible/secretos.yml (ignorado por git) y completa las claves.
# Úsalo con: ansible-playbook edge-baseline.yml -e @secretos.yml
#
# clave_ingesta: la misma CLAVE_INGESTA de edge/.env (es una sola para las dos sedes).
# mqtt_claves: la contraseña del broker EMQX de cada Edge. Cada sede tiene su propio usuario:
#   local1 → usuario edge-local1 (Planta)    local2 → usuario edge-local2 (Oficinas)
clave_ingesta: ""
mqtt_claves:
  local1: ""
  local2: ""
