# Configuración de Ansible para Induplac (tarea 33).
# Se usa sola si corres los comandos dentro de esta carpeta (cd ansible).
[defaults]
inventory = inventario.ini
remote_user = ubuntu
private_key_file = ~/.ssh/labsuser.pem
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
# accept-new: acepta la huella de una EC2 nueva sin preguntar, pero avisa si una conocida cambia.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
