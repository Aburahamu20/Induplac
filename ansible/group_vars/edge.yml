# Variables comunes a todos los Edge (grupo [edge] del inventario).
zona_horaria: America/Santiago

usuario_edge: induplac            # usuario de sistema que corre el Edge (sin login)
base_dir: /opt/induplac
repo_url: https://github.com/Aburahamu20/Induplac.git
repo_version: main                # rama o commit a instalar: así se sabe qué versión quedó en cada sede
repo_dir: "{{ base_dir }}/repo"
edge_dir: "{{ repo_dir }}/edge"
venv_dir: "{{ base_dir }}/venv"

paquetes_base:
  - python3
  - python3-venv
  - git
  - sqlite3
  - chrony                        # hora sincronizada por NTP: los intervalos de 15 min dependen de ella
  - acl                           # permite a Ansible ejecutar tareas como el usuario induplac

# Configuración del Edge (edge/.env). Lo que no es secreto va aquí.
mqtt_host: gb12d98f.ala.us-east-1.emqxsl.com
mqtt_port: 8883
mqtt_usuario: "edge-{{ local_id }}"   # cada sede con su usuario del broker: edge-local1 / edge-local2
aws_api_url: https://3j82c54obf.execute-api.us-east-1.amazonaws.com
api_port: 8080

# Demo (Nota 3): panel 🎬 Demo del dashboard de planta (cortar/restablecer internet, UV alto, sobreconsumo).
# Nunca en producción. Se prende solo para la presentación: -e edge_demo=true
edge_demo: false
# Dashboard de planta: se compila en el equipo de control (WSL, necesita Node 20+) y se copia a cada Edge.
# Solo cuando cambia el dashboard: -e edge_dashboard=true
edge_dashboard: false

# Secretos: NUNCA en el repo. Van en ansible/secretos.yml (ignorado por git) o con -e.
#   clave_ingesta y mqtt_claves (una por sede: local1 → edge-local1, local2 → edge-local2)
# Sin secretos, el Edge queda instalado pero el servicio detenido.
