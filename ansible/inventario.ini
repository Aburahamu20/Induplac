# Inventario de Induplac: los gateways Edge de cada sede (tarea 33).
# En el diseño hay una Raspberry Pi por sede; para la Nota 3 se simulan con 2 EC2 Ubuntu del Learner Lab.
# ⚠️ La IP pública de una EC2 cambia cada vez que se detiene y se vuelve a iniciar: actualízala aquí.

[edge]
edge-planta    ansible_host=REEMPLAZAR_IP_PLANTA    sede=planta    local_id=local1
edge-oficinas  ansible_host=REEMPLAZAR_IP_OFICINAS  sede=oficinas  local_id=local2
